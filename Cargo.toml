[workspace]
resolver = "2"
members = ["crates/karl-core", "crates/karl-sources", "crates/karld", "crates/karl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/akarlsson/Karl"

[workspace.dependencies]
karl-core = { path = "crates/karl-core" }
karl-sources = { path = "crates/karl-sources" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
sha2 = "0.10"
base64 = "0.23"
url = "2"
urlencoding = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
