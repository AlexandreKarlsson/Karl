[project]
site_name = "Karl"
site_description = "A personal data plane for an AI agent: read-only, pre-digested, policy at the socket."
site_url = "https://example.invalid/karl/"
docs_dir = "docs"
site_dir = "site"
copyright = "MIT"

nav = [
  { "Karl" = "index.md" },
  { "Architecture" = "architecture.md" },
  { "One request" = "request.md" },
  { "Security" = "security.md" },
  { "Commands" = "commands.md" },
  { "Protocol" = "protocol.md" },
  { "Policy file" = "policy.md" },
  { "Sources" = "sources.md" },
  { "Deploy" = "deploy.md" },
  { "Own harness" = "harness.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
